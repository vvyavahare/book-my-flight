spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: flight-search
              uri: ${airline.services.flight-search-url:http://localhost:8081}
              predicates:
                - Path=/api/flights/**
            - id: booking
              uri: ${airline.services.booking-url:http://localhost:8082}
              predicates:
                - Path=/api/bookings/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway

# ---------------------------------------------------------------------------
# Security / routing configuration
# ---------------------------------------------------------------------------
airline:
  services:
    flight-search-url: http://localhost:8081
    booking-url: http://localhost:8082
  cors:
    allowed-origins: http://localhost:3000
  security:
    # Demo login credentials (dev only). Replaced by a real auth service later.
    demo-user: demo
    demo-password: demo
    # Admin login credentials (dev only). Grants the ADMIN role.
    admin-user: admin
    admin-password: admin
    jwt:
      # Dev-only secret. Override via env var AIRLINE_SECURITY_JWT_SECRET in real environments.
      secret: dev-secret-please-change-this-to-a-long-random-value-in-production
      issuer: airline-api-gateway
      expiration-minutes: 60
